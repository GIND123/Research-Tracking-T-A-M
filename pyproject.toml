[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tekne"
version = "0.3.0"
description = "Grounded extraction of technology mentions from scientific papers and patents"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyahocorasick>=2.0",
    "rapidfuzz>=3.6",
    "regex>=2023.12",
    "orjson>=3.9",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "lxml>=5.1",
    "spacy>=3.7",
]

[project.optional-dependencies]
neural = ["torch>=2.2", "transformers>=4.40", "sentence-transformers>=2.7"]
llm = ["anthropic>=0.34"]
plots = ["matplotlib>=3.8", "pandas>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[project.scripts]
tekne = "tekne.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tekne = ["resources/*.json", "resources/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
